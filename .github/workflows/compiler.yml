on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - run: mkdir -p bin
    - run: find src -name "*.java" > fuentes.txt
    - run: javac -d bin @fuentes.txt